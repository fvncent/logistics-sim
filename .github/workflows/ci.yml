name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    services:
      tms-postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: vlsim
          POSTGRES_PASSWORD: vlsim
          POSTGRES_DB: tms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vlsim -d tms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VLSIM_TMS_DSN: postgresql+psycopg://vlsim:vlsim@localhost:5432/tms
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --frozen
      - run: make lint
      - run: make test
      - name: Integration tests (Postgres only; Redpanda joins in M5)
        run: uv run pytest -m "integration and not redpanda"
