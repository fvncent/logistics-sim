name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    services:
      tms-postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: vlsim
          POSTGRES_PASSWORD: vlsim
          POSTGRES_DB: tms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vlsim -d tms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VLSIM_TMS_DSN: postgresql+psycopg://vlsim:vlsim@localhost:5432/tms
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --frozen
      - name: Apply CDC server settings from compose.yaml (service containers take no command)
        run: |
          uv run python -m tests.compose_info alter-system \
            | docker exec -i ${{ job.services.tms-postgres.id }} psql -v ON_ERROR_STOP=1 -U vlsim -d tms
          docker restart ${{ job.services.tms-postgres.id }}
          for i in $(seq 1 30); do
            docker exec ${{ job.services.tms-postgres.id }} pg_isready -U vlsim -d tms && break
            sleep 2
          done
      - name: Start Redpanda (Compose; service containers cannot pass its start arguments)
        run: docker compose --profile core up -d --wait redpanda
      - run: make lint
      - run: make test
      - name: Integration tests (Postgres service container + Compose Redpanda)
        run: uv run pytest -m integration
